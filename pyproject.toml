[project]
name = "outerspace-exploration-and-images"
version = "1.1.0"
description = "Dashboard of space pictures from NASA and ESA/Webb by object and telescope, plus past and planned spaceflights."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
    "types-defusedxml>=0.7.0.20260504",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The live checks are left out here; GitHub runs them once a day.
# The browser test uses the Chrome that's already installed.
addopts = "--cov --cov-report=term-missing -m 'not live' --browser-channel chrome"
markers = [
    "live: calls the real NASA, Launch Library, and ESA/Webb sources (run with: -m live --no-cov)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
exclude_gitignore = true
