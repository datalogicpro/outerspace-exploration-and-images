name: Live source check

# Calls the real NASA, Launch Library, and ESA/Webb sources once a day to
# catch changes to what they send. It can also be run by hand from the
# Actions tab.
on:
  schedule:
    - cron: "41 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the live sources
        run: uv run pytest -m live --no-cov
